name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # A weekly run catches vulnerabilities disclosed after the last commit.
    # A library with no dependencies still uses the standard library, and that
    # is where the findings would come from.
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write
  # For the workflow-run endpoint CodeQL reads to send its status report. A
  # private repository does not grant it by default, and without it the log
  # carries a "Resource not accessible by integration" warning that is easy to
  # mistake for the cause of a failure. It is not one: see the note on the jobs.
  actions: read

# The gosec and CodeQL jobs both end by uploading SARIF to code scanning, which
# GitHub provides free on public repositories and, on private ones, only with
# Advanced Security. On a private repository the analysis runs, succeeds, and
# then fails at the upload with "Code scanning is not enabled for this
# repository", which reads like a broken workflow rather than a missing feature.
# So both skip unless the repository is public. When the visibility cannot be
# read from the event payload they run anyway, because being public is the case
# that matters. govulncheck uploads nothing and always runs.
jobs:
  govulncheck:
    name: Vulnerability check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          # No go.sum will ever exist here, so there is nothing to cache and
          # setup-go would annotate every run with a failed cache restore.
          cache: false

      - name: govulncheck
        uses: golang/govulncheck-action@v1

  gosec:
    name: gosec
    runs-on: ubuntu-latest
    if: github.event.repository.private != true

    steps:
      - uses: actions/checkout@v6

      # This library computes HMAC signatures and builds authenticated HTTP
      # requests, so a SAST pass over crypto and network code earns its slot
      # here more than it would on an average library.
      # Pinned to a patch version, unlike every other action here: securego/gosec
      # publishes no floating v2 tag, so @v2 does not resolve at all. Dependabot
      # bumps it weekly.
      - name: gosec
        uses: securego/gosec@v2.28.0
        with:
          args: -no-fail -fmt sarif -out gosec-results.sarif ./...

      - name: Upload gosec results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gosec-results.sarif

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    if: github.event.repository.private != true

    steps:
      - uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go
          config-file: .github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Analyze
        uses: github/codeql-action/analyze@v4
